# flat7RW_fric (stage 12, run 9): the 11-10 contact frictions and their DR. Nothing else changes.
base: rigid_cloth_right_wuji

env:
  assets:                       # centres: robot 0.5, table 1.0, plate 1.0 under cloth_min
    finger_tip_friction: 0.5
    table_friction: 1.0
  rigid_cloth:
    slat_friction: 1.0
  physx_chain:
    friction_model: cloth_min
  domain_randomization:         # the cloth block's friction terms only
    cloth:
      slat_friction_scale: [0.7, 1.5]
      robot_friction_scale: [0.7, 1.3]
      table_friction_scale: [0.7, 1.3]
