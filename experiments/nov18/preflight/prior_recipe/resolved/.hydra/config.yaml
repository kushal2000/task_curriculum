      clearance: 0.1
      latch_steps: 3
      fold_tolerance: 0.0
      touch: robot_clearance
      touch_gap: 0.002
      contact_bodies: ''
      fold_entry_bonus: 1000.0
      release_bonus: 1000.0
      release_dist_rew_scale: 0.0
      persist_rew_per_step: 0.0
      persist_bonus: 0.0
      persist_window_steps: 180
      persist_fail_penalty: -300.0
      persist_fail_terminates: true
      persist_consecutive: true
