    solver_velocity_iterations: 0
    spawn_clearance: 0.002
    place_x:
    - -0.2
    - 0.2
    place_y:
    - -0.17
    - 0.17
    randomization:
      enabled: true
      profile: material
      yibo_cloth_friction:
      - 0.7
      - 1.5
      yibo_robot_friction:
      - 0.35
      - 0.65
      yibo_table_friction:
      - 0.7
      - 1.3
      yibo_rest_offset:
      - 0.004
      - 0.01
      yibo_friction_seed: 0
      density:
      - 0.02
      - 0.5
      hinge_armature_scale:
      - 0.0
      - 0.0
      bending_rigidity:
      - 1.0e-06
      - 0.00025
      bending_viscosity:
      - 1.0e-06
      - 0.00015
      table_static_friction:
      - 0.1
      - 0.8
      hand_static_friction:
      - 0.3
      - 1.2
      dynamic_friction_ratio:
      - 0.6
      - 1.0
      friction_buckets: 16
    episode_checks:
      outside_table: true
      press_driven_fold: true
      table_margin: 1.0e-05
      minimum_lifting_work_fraction: 0.1
      minimum_lift_angle_deg: 30.0
      maximum_base_tilt_deg: 20.0
      minimum_opposed_load: 0.001
      contact_points_per_env: 128
    thickness_curriculum:
      enabled: true
      start: 0.02
      target: 0.002
      reduction: 0.9
      success_threshold: 0.9
      window_episodes: 4096
agent:
  params:
    seed: 42
    env:
      clip_observations: 10.0
      clip_actions: 1.0
    algo:
      name: a2c_continuous
    model:
      name: continuous_a2c_logstd
    network:
      name: actor_critic
      separate: false
      space:
        continuous:
          mu_activation: None
          sigma_activation: None
          mu_init:
            name: default
          sigma_init:
            name: const_initializer
            val: 0
          fixed_sigma: coef_cond
      mlp:
        units:
        - 1024
        - 1024
        - 512
        - 512
        activation: elu
        d2rl: false
        initializer:
          name: default
        regularizer:
          name: None
      rnn:
        name: lstm
        units: 1024
        layers: 1
        before_mlp: true
        layer_norm: true
    load_checkpoint: true
    load_path: pretrained_policy/flexiv_wuji_finetuned/flat7RW_fricition.pth
    checkpoint_load_mode: weights
    config:
      name: 0_cloth_curriculum_prior_20to2mm
      full_experiment_name: ${.name}
      env_name: rlgpu
      device: cuda:0
      device_name: cuda:0
      multi_gpu: false
      ppo: true
      mixed_precision: true
      normalize_input: true
      normalize_value: true
      value_bootstrap: true
      normalize_advantage: true
      reward_shaper:
        scale_value: 0.01
      num_actors: ${....env.scene.num_envs}
      gamma: 0.99
      tau: 0.95
      learning_rate: '1e-4'
      lr_schedule: adaptive
      schedule_type: standard
      kl_threshold: 0.016
      score_to_win: 1000000
      max_epochs: -1
      save_best_after: 1
      best_save_min_interval_s: 60
      save_frequency: 3000
      periodic_save_every: 10
      periodic_keep: 15
      periodic_keep_epochs: []
      snapshot_every: 100
      print_stats: true
      grad_norm: 1.0
      entropy_coef: 0.0
      truncate_grads: true
      e_clip: 0.1
      minibatch_size: 24576
      mini_epochs: 2
      critic_coef: 4.0
      clip_value: true
      horizon_length: 32
      seq_length: 16
      bounds_loss_coef: 0.0001
      central_value_config:
        minibatch_size: 24576
        mini_epochs: 2
        learning_rate: '1e-4'
        kl_threshold: 0.016
        clip_value: true
        normalize_input: true
        truncate_grads: true
        network:
          name: actor_critic
          central_value: true
          mlp:
            units:
            - 1024
            - 1024
            - 512
            - 512
            activation: elu
            d2rl: false
            initializer:
              name: default
            regularizer:
              name: None
      use_others_experience: lf
      off_policy_ratio: 1.0
      expl_type: mixed_expl_learn_param
      expl_reward_type: entropy
      expl_reward_coef_embd_size: 32
      expl_reward_coef_scale: 0.002
      expl_coef_block_size: 2048
      player:
        deterministic: false
        games_num: 100000
        print_stats: false
