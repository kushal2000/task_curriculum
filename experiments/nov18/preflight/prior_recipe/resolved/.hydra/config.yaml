    robot_friction: 0.5
    finger_tip_friction: 1.5
    table_friction: 0.5
  action:
    arm_moving_average: 0.1
    hand_moving_average: 0.1
    dof_speed_scale: 1.5
    arm_effort_limit: []
  obs:
    state_list:
    - joint_pos
    - joint_vel
    - prev_action_targets
    - palm_pos
    - palm_rot
    - palm_vel
    - object_rot
    - object_vel
    - fingertip_pos_rel_palm
    - keypoints_rel_palm
    - keypoints_rel_goal
    - object_scales
    - closest_keypoint_max_dist
    - closest_fingertip_dist
    - lifted_object
    - progress
    - successes
    - reward
    obs_list:
    - joint_pos
    - joint_vel
    - prev_action_targets
    - palm_pos
    - palm_rot
    - object_rot
    - fingertip_pos_rel_palm
    - keypoints_rel_palm
    - keypoints_rel_goal
    - object_scales
    keypoint_mode: yibo
    yibo_contact_thickness: null
    yibo_goal_lift: 0.0
    keypoint_scale: 1.5
    clamp_abs_observations: 10.0
  reward:
    keypoint_rew_scale: 1500.0
    reach_goal_bonus: 1000.0
    distance_delta_rew_scale: 50.0
    fingertip_distance_from_pad: true
    kuka_actions_penalty_scale: 0.03
    hand_actions_penalty_scale: 0.003
    object_base_size: 0.04
  reset:
    reset_dof_pos_random_interval_arm: 0.1
    reset_dof_pos_random_interval_fingers: 0.1
    reset_dof_vel_random_interval: 0.5
    table_reset_z: 0.38
    table_reset_z_range: 0.0
    table_reset_xy:
