    keypoint_tolerance: 0.015
    max_folded_footprint: 0.65
    min_unfolded_footprint: 0.9
    unfold_prob: 0.5
    unfold_start_deg:
    - 180.0
    - 180.0
    unfold_on_table: false
    on_table_max_spread: 0.015
    on_table_max_lift: 0.015
    nan_policy: reset
    release:
