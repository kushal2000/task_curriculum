    - 0.5
    - -1.5
    - 1.2
    lookat:
    - 0.0
    - 0.4
    - 0.5
    cam_prim_path: /OmniverseKit_Persp
    resolution:
    - 640
    - 480
    origin_type: world
    env_index: 0
    asset_name: null
    body_name: null
  sim:
    physics_prim_path: /physicsScene
    device: cuda:0
    dt: 0.008333333333333333
    render_interval: 2
    gravity:
    - 0.0
    - 0.0
    - -9.81
    enable_scene_query_support: false
    use_fabric: true
    physx:
      solver_type: 1
      solve_articulation_contact_last: false
      min_position_iteration_count: 8
