# rigidcloth_pc_half_fold_friction (was gpE_fric; its runs and checkpoints keep that name):
# rigidcloth_pc_half_fold on the flat7RW_fric env (the 11-10 contact frictions and their per-env DR),
# for DAgger from the flat7RW_fric teacher.
base: rigid_cloth_right_wuji

env:
  assets:                       # flat7RW_fric: centres robot 0.5, table 1.0, plate 1.0 under cloth_min
    finger_tip_friction: 0.5
    table_friction: 1.0
  rigid_cloth:
    slat_friction: 1.0
  physx_chain:
    friction_model: cloth_min
  domain_randomization:         # and their DR
    cloth:
      slat_friction_scale: [0.7, 1.5]
      robot_friction_scale: [0.7, 1.3]
      table_friction_scale: [0.7, 1.3]
  obs:
    object: pointcloud
    pointcloud:
      goal: goal_fixed          # or goal_any (the bare shape at any yaw)
      ref_step: 12
  fold_pool:
    goal_task:
      mode: half_fold
      accept_lookalike: true
