# rigidcloth_pc_half_fold_rl (was pcRW_scratch_gpE; its runs keep that name): SAPG from scratch with the
# point-cloud actor (pc_rl.py) on easy mode with the goal tables and accept_lookalike, the clean cloud with
# the goal group (rigidcloth_pc_half_fold; goal_any as an override). 11-17/18: did not learn in 3052
# epochs (best: goal_any in the 90 deg sector, 25%).
base: rigidcloth_pc_half_fold

agent:
  params:
    config:
      best_save_min_interval_s: 1800   # a "best" checkpoint is ~0.5 GB and 7 s; the evaluations use snap_* / last_*
