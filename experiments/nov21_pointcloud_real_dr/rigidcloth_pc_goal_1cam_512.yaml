# rigidcloth_pc_goal_1cam_512: goal point cloud (goal_fixed, half fold, accept_lookalike) on the flat7RW_fric env, for DAgger
# from the flat7RW_fric teacher -- rigidcloth_pc_half_fold_friction with ONE camera (a = left_camera_nov7),
# 512 points, the version C camera errors (cloud 0-6 steps late). Proprioception 0-3 and actions 0-2 steps late.
base: rigid_cloth_right_wuji
dr: [pointcloud]

env:
  assets:                       # flat7RW_fric: centres robot 0.5, table 1.0, plate 1.0 under cloth_min
    finger_tip_friction: 0.5
    table_friction: 1.0
  rigid_cloth:
    slat_friction: 1.0
  physx_chain:
    friction_model: cloth_min
  domain_randomization:
    cloth:
      slat_friction_scale: [0.7, 1.5]
      robot_friction_scale: [0.7, 1.3]
      table_friction_scale: [0.7, 1.3]
    proprio:
      delay_max: 3
    action:
      delay_max: 2
  obs:
    object: pointcloud
    pointcloud:
      goal: goal_fixed
      ref_step: 12
      cameras: a
      n_points: 512
  fold_pool:
    goal_task:
      mode: half_fold
      accept_lookalike: true
