# flat7RW_fricSysid (stage 12, run 14, control for 13): the identified hand + hand DR and the 11-10
# contact frictions + friction DR. No delay / noise DR.
base: rigid_cloth_right_wuji

env:
  hand_sysid: true
  assets:
    finger_tip_friction: 0.5
    table_friction: 1.0
  rigid_cloth:
    slat_friction: 1.0
  physx_chain:
    friction_model: cloth_min
  domain_randomization:
    robot:
      hand_friction_scale: [0.7, 1.3]
      hand_effort_limit_scale: [0.85, 1.15]
    cloth:
      slat_friction_scale: [0.7, 1.5]
      robot_friction_scale: [0.7, 1.3]
      table_friction_scale: [0.7, 1.3]
