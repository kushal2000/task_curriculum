# flat7RW_DR_delay (stage 12, run 12): flat7DRABC's delay / noise DR (A and B layers, no C): the
# proprio, keypoints and action blocks with the Kuka runs' values -- proprioception and action 0-2
# steps late, joint position noise 0.01 rad -- and PD gains x0.8-1.2.
#
# Since 2026-11-19 the sheet's lag (0-5 steps) is independent of the proprioception's; the run itself
# stacked them (the sheet 0-5 steps late on top of the whole observation's 0-2).
base: rigid_cloth_right_wuji
dr: [proprio, keypoints, action]

env:
  domain_randomization:
    proprio:
      delay_max: 2
      joint_pos_noise_std: 0.01
    action:
      delay_max: 2
    robot:
      stiffness_scale: [0.8, 1.2]
      damping_scale: [0.8, 1.2]
