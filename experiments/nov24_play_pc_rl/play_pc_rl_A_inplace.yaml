# play_pc_rl_A_inplace (2026-11-24): play_pc_rl_A with the in-place gate: a fold also needs the sheet's
# surface within max_in_place_dist of the frozen goal's, both ways, NOT aligned (only the goal's own
# fold, made where the goal shows it). The gate tightens by stages, 12 -> 2 cm, with the slide penalty
# (the stationary half's in-plane travel) ramping 0 -> 1000 per metre; the next stage once a window of
# 50000 finished episodes folds >= 50% (mdp/task.py; the 11-20 gate curriculum on the new distance).
base: experiments/nov24_play_pc_rl/play_pc_rl_A.yaml

env:
  termination:
    gate_curriculum:
      max_in_place_dist:   [0.12, 0.09, 0.06, 0.04, 0.03, 0.02]
      slide_penalty_scale: [0.0, 200.0, 400.0, 600.0, 800.0, 1000.0]
      advance_rate: 0.5
      window_episodes: 50000
