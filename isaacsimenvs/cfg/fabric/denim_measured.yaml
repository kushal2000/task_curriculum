# Denim, from measurements of a 15 x 15 cm swatch (2026-11-07). Literature preset: denim.yaml.
# density = mass / area; edge_ke tuned by fabric_cantilever.py so the env's 5 cm flap matches the elastica
# for the measured bending length; edge_kd = 1e-3 x density / 2.0; soft_contact_mu = mu_table^2 / 0.5
# (Cloth.yaml table_friction 0.5); tri_ke = tri_ka from denim.yaml (stretch not measured).
cloth:
  density: 0.1822
  tri_ke: 200.0
  tri_ka: 200.0
  edge_ke: 0.0006594   # cantilever fit (235 x B), job 28243812
  edge_kd: 9.11e-05
  soft_contact_mu: 0.265
  self_contact_radius: 0.002
plastic_yield_curvature: 100.0   # checkerboard mesh (outputs/results/cloth_fold_lift/alt, job 28503469): released fold 3.4 mm high at the crease (flat 2.0; 150 left 5.9), no skew, cantilever unchanged (78.3), no drape set; cost: max rest angle left after unfolding 78 deg (150: 30). Was 150 on the uniform mesh (job 28268743)
measured:
  mass_g: 4.1   # 15 x 15 cm swatch
  cantilever_deg: 80   # tip-line angle down from horizontal, 5.25 cm overhang
  friction_deg: 20   # sliding angle on a table / board
  fold_test: folded over and let go -> stays folded
  press_test: 213.1 g weight on the folded swatch -> lies flat; unfolds flat with no crease
  bending_length_m: 0.01162
  bending_rigidity: 2.802e-06   # B = rho g c^3 [N m], read by fabric_cantilever.py
