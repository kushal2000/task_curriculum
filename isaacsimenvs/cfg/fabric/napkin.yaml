# Napkin. No shear source: tri at the env default.
# Where each value comes from: isaacsimenvs/tasks/cloth/utils/fabrics.py
cloth:
  density: 0.165
  tri_ke: 100.0
  tri_ka: 100.0
  edge_ke: 0.00324
  edge_kd: 8.25e-05
  soft_contact_mu: 0.19
  self_contact_radius: 0.002
plastic_yield_curvature: 50.0
literature:
  bending_rigidity: 2.4e-05   # B [N m], KES / cantilever
  tri_range: [1100.0, 6100.0]   # tri_ke = tri_ka = 3E/8 from tensile data (10-31), not applied
