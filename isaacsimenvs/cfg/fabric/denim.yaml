# Denim. No friction source: mu at the env default.
# Where each value comes from: isaacsimenvs/tasks/cloth/utils/fabrics.py
cloth:
  density: 0.44
  tri_ke: 200.0
  tri_ka: 200.0
  edge_ke: 0.0111
  edge_kd: 0.00022
  soft_contact_mu: 0.25
  self_contact_radius: 0.002
plastic_yield_curvature: 50.0
literature:
  bending_rigidity: 8.8e-05   # B [N m], KES / cantilever
  tri_range: [1100.0, 12000.0]   # tri_ke = tri_ka = 3E/8 from tensile data (10-31), not applied
