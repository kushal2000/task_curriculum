# chiffon_vbd_coarse: chiffon_vbd on a 17 mm irregular mesh (50 particles on 10 cm, as the 7x7 grid), 2026-11-16.
# bending_stiffness_scale re-fit with the elastic cantilever probe (outputs/cloth_probe/coarse_cal, fit.json);
# fold/press checks in outputs/cloth_probe/coarse17. Rheology as chiffon_vbd. Header of chiffon_vbd below.
# chiffon: the irregular-mesh hinge-rheology cloth (isaacsimenvs/tasks/cloth/utils/hinge_rheology.py), 2026-11-17.
# Bending comes from the measured rigidity B (per-edge B / w_e) and a calibrated bending_stiffness_scale so the 5 cm
# cantilever droops like the swatch (outputs/cloth_probe/v4, v5). Contact as the env: 8 mm particle radius,
# 2 mm self-contact. Swatch target: rarely stays even when pressed.
# Table contact friction selected from the fixed-simulator Nov 20 fold, press and robot sweep.
cloth:
  mesh_kind: irregular
  edge_length: 0.017
  density: 0.01778
  tri_ke: 10.0
  tri_ka: 10.0
  edge_kd: 8.89e-06
  soft_contact_mu: 0.265
  table_contact_mu: 1.0
  bending_rigidity: 2.749e-06
  bending_stiffness_scale: 1.12
  friction_ratio: 0.3
  friction_slip_curvature: 20.0
  yield_curvature: 0.0   # 0 = no permanent set
  yield_hardening: 0.0
measured:
  cantilever_deg: 45
  bending_rigidity: 2.749e-06
