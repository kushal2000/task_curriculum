# Chiffon, from measurements of a 15 x 15 cm swatch (2026-11-07). Literature preset: chiffon.yaml.
# density = mass / area; edge_ke tuned by fabric_cantilever.py so the env's 5 cm flap matches the elastica
# for the measured bending length; edge_kd = 1e-3 x density / 2.0; soft_contact_mu = mu_table^2 / 0.5
# (Cloth.yaml table_friction 0.5); tri_ke = tri_ka from chiffon.yaml (stretch not measured).
cloth:
  table_contact_mu: 0.363970  # tan(20 degrees), measured slide onset
  density: 0.01778
  tri_ke: 28.0
  tri_ka: 28.0
  edge_ke: 0.0005275   # cantilever fit (192 x B), job 28243812
  edge_kd: 8.89e-06
  soft_contact_mu: 0.265
  self_contact_radius: 0.002
plastic_yield_curvature: 42.0   # 7x7 touch fold, job 28388174 (cloth_plasticity_measured_r7_touch_chiffon): let go -> bounces to 13 deg (1.48 cm, just inside the 1.5 cm cutoff), pressed 0.93 N -> 2 deg (0.39 cm), drape +6.2 deg. Was 40 (9 deg; drape +8.1)
measured:
  mass_g: 0.4   # 15 x 15 cm swatch
  cantilever_deg: 45   # tip-line angle down from horizontal, 5.25 cm overhang
  friction_deg: 20   # sliding angle on a table / board
  fold_test: folded over and let go -> stays folded, very small gap, teardrop
  press_test: 213.1 g weight on the folded swatch -> lies flat; unfolds flat with no crease
  bending_length_m: 0.02507
  bending_rigidity: 2.749e-06   # B = rho g c^3 [N m], read by fabric_cantilever.py
