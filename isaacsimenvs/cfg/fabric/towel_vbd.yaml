# towel: the irregular-mesh hinge-rheology cloth (isaacsimenvs/tasks/cloth/utils/hinge_rheology.py), 2026-11-17.
# Bending comes from the measured rigidity B (per-edge B / w_e) and a calibrated bending_stiffness_scale so the 5 cm
# cantilever droops like the swatch (outputs/cloth_probe/v4, v5). Contact as the env: 8 mm particle radius,
# 2 mm self-contact. Swatch target: unpressed fold stays.
cloth:
  table_contact_mu: 0.577350  # tan(30 degrees), measured slide onset
  mesh_kind: irregular
  edge_length: 0.010
  density: 0.3244
  tri_ke: 200.0  # Fixed-simulator sweep eliminated the observed nonfinite reset and sustained penetration.
  tri_ka: 200.0
  edge_kd: 0.000162
  soft_contact_mu: 0.667
  bending_rigidity: 9.26e-06
  bending_stiffness_scale: 0.87
  friction_ratio: 0.3
  friction_slip_curvature: 20.0
  yield_curvature: 0.0   # 0 = no permanent set
  yield_hardening: 0.0
measured:
  cantilever_deg: 75
  bending_rigidity: 9.26e-06
