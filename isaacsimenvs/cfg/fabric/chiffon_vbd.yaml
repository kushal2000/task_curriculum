# chiffon: the irregular-mesh hinge-rheology cloth (isaacsimenvs/tasks/cloth/utils/hinge_rheology.py), 2026-11-17.
# Bending comes from the measured rigidity B (per-edge B / w_e) and a calibrated bending_stiffness_scale so the 5 cm
# cantilever droops like the swatch (outputs/cloth_probe/v4, v5). Contact as the env: 8 mm particle radius,
# 2 mm self-contact. Swatch target: rarely stays even when pressed.
cloth:
  mesh_kind: irregular
  edge_length: 0.010
  density: 0.01778
  tri_ke: 40.0  # Fixed-simulator sweep eliminated the observed nonfinite resets.
  tri_ka: 40.0
  edge_kd: 8.89e-06
  soft_contact_mu: 0.265
  bending_rigidity: 2.749e-06
  bending_stiffness_scale: 2.17
  friction_ratio: 0.3
  friction_slip_curvature: 20.0
  yield_curvature: 0.0   # 0 = no permanent set
  yield_hardening: 0.0
measured:
  cantilever_deg: 45
  bending_rigidity: 2.749e-06
