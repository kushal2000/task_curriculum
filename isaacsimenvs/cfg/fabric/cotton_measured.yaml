# Cotton, from measurements of a 15 x 15 cm swatch (2026-11-07). Literature preset: cotton.yaml.
# density = mass / area; edge_ke tuned by fabric_cantilever.py so the env's 5 cm flap matches the elastica
# for the measured bending length; edge_kd = 1e-3 x density / 2.0; soft_contact_mu = mu_table^2 / 0.5
# (Cloth.yaml table_friction 0.5); tri_ke = tri_ka from cotton.yaml (stretch not measured).
cloth:
  table_contact_mu: 0.363970  # tan(20 degrees), measured slide onset
  density: 0.1156
  tri_ke: 56.0
  tri_ka: 56.0
  edge_ke: 0.004249   # cantilever fit (127 x B), job 28243812
  edge_kd: 5.78e-05
  soft_contact_mu: 0.265
  self_contact_radius: 0.002
plastic_yield_curvature: 20.0   # refit 2026-11-10 on the alternate (checkerboard) mesh, job 28575191: let go -> 0.30 cm / 2.8 deg (real: stays, slight gap); pressed holds; hanging droop 43 deg vs measured cantilever 30 (drape takes a 21 deg set). Was 30 (fit on the uniform mesh), which opens 43 deg on the current one.
measured:
  mass_g: 2.6   # 15 x 15 cm swatch
  cantilever_deg: 30   # tip-line angle down from horizontal, 5.25 cm overhang
  friction_deg: 20   # sliding angle on a table / board
  fold_test: folded over and let go -> stays folded, slight gap, teardrop
  press_test: 213.1 g weight on the folded swatch -> lies flat; unfolds flat with no crease
  bending_length_m: 0.03094
  bending_rigidity: 3.358e-05   # B = rho g c^3 [N m], read by fabric_cantilever.py
