# Towel, from measurements of a 15 x 15 cm swatch (2026-11-07). Literature preset: towel.yaml.
# density = mass / area; edge_ke tuned by fabric_cantilever.py so the env's 5 cm flap matches the elastica
# for the measured bending length; edge_kd = 1e-3 x density / 2.0; soft_contact_mu = mu_table^2 / 0.5
# (Cloth.yaml table_friction 0.5); tri_ke = tri_ka from towel.yaml (stretch not measured).
cloth:
  density: 0.3244
  tri_ke: 100.0
  tri_ka: 100.0
  edge_ke: 0.001394   # cantilever fit (151 x B), job 28243812
  edge_kd: 0.000162
  soft_contact_mu: 0.667
  self_contact_radius: 0.0037   # ~5x the others' thickness; kept at towel.yaml's 3.7 mm
  self_contact_margin: 0.0055
plastic_yield_curvature: 60.0   # checkerboard mesh (docs/results/cloth_fold_lift/alt, job 28503469): released fold 4.0 mm high at the crease (flat 3.8; 100 left 5.5), no skew; cost: the free drape yields (28 deg set), cantilever droop 78.4 vs 72.8 at 100 (measured 75). Was 100 on the uniform mesh (job 28268743)
measured:
  mass_g: 7.3   # 15 x 15 cm swatch
  cantilever_deg: 75   # tip-line angle down from horizontal, 5.25 cm overhang
  friction_deg: 30   # sliding angle on a table / board
  fold_test: folded over and let go -> stays folded
  press_test: 213.1 g weight on the folded swatch -> lies flat; unfolds flat with no crease
  bending_length_m: 0.01428
  bending_rigidity: 9.26e-06   # B = rho g c^3 [N m], read by fabric_cantilever.py
