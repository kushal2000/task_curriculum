# Big napkin, from measurements of a 15 x 15 cm swatch (2026-11-07). Literature preset: napkin.yaml.
# density = mass / area; edge_ke tuned by fabric_cantilever.py so the env's 5 cm flap matches the elastica
# for the measured bending length; edge_kd = 1e-3 x density / 2.0; soft_contact_mu = mu_table^2 / 0.5
# (Cloth.yaml table_friction 0.5); tri_ke = tri_ka from napkin.yaml (stretch not measured).
cloth:
  table_contact_mu: 0.363970  # tan(20 degrees), measured slide onset
  density: 0.08
  tri_ke: 100.0
  tri_ka: 100.0
  edge_ke: 0.003893   # cantilever fit (168 x B), job 28243812
  edge_kd: 4.0e-05
  soft_contact_mu: 0.265
  self_contact_radius: 0.002
plastic_yield_curvature: 25.0   # balanced per fabric (7x7 touch fold, job 28268743): let go -> 12 deg (near no lift), weighted -> flat (3.4), unfold crease 6-7 deg; cantilever +8.8 deg (20: 4 deg, +19)
measured:
  mass_g: 1.8   # 15 x 15 cm swatch
  cantilever_deg: 30   # tip-line angle down from horizontal, 5.25 cm overhang
  friction_deg: 20   # sliding angle on a table / board
  fold_test: folded over and let go -> stays folded, no lift, teardrop
  press_test: 213.1 g weight on the folded swatch -> lies flat; unfolds flat with no crease
  bending_length_m: 0.03094
  bending_rigidity: 2.324e-05   # B = rho g c^3 [N m], read by fabric_cantilever.py
