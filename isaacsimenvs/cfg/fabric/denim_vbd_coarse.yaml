# denim_vbd_coarse: denim_vbd on a 17 mm irregular mesh (50 particles on 10 cm, as the 7x7 grid), 2026-11-16.
# bending_stiffness_scale re-fit with the elastic cantilever probe (outputs/cloth_probe/coarse_cal, fit.json);
# fold/press checks in outputs/cloth_probe/coarse17. Rheology as denim_vbd. Header of denim_vbd below.
# denim: the irregular-mesh hinge-rheology cloth (isaacsimenvs/tasks/cloth/utils/hinge_rheology.py), 2026-11-17.
# Bending from the swatch's measured rigidity B (per-edge B / w_e), a soft membrane (10 N/m) so VBD at the env's
# 12 iterations / 1/1440 s resolves bending, and a calibrated solver factor bending_stiffness_scale so the 5 cm
# cantilever droops like the swatch (outputs/cloth_probe/v4, v5). Contact as the env: 8 mm particle radius,
# 2 mm self-contact. Swatch target: unpressed fold stays.
cloth:
  table_contact_mu: 0.363970  # tan(20 degrees), measured slide onset
  mesh_kind: irregular
  edge_length: 0.017
  density: 0.1822
  tri_ke: 10.0
  tri_ka: 10.0
  edge_kd: 9.11e-05
  soft_contact_ke: 1000.0  # Fixed-simulator sweep reduced penetration duration and press failures.
  soft_contact_mu: 0.265
  bending_rigidity: 2.802e-06
  bending_stiffness_scale: 0.5
  friction_ratio: 0.3
  friction_slip_curvature: 20.0
  yield_curvature: 0.0   # 0 = no permanent set
  yield_hardening: 0.0
measured:
  cantilever_deg: 80
  bending_rigidity: 2.802e-06
