# Silk. Sources conflict (Sung 1987 KES: stiffer than cotton; RGBench: 19x softer); this follows Sung.
# Where each value comes from: isaacsimenvs/tasks/cloth/utils/fabrics.py
cloth:
  density: 0.035
  tri_ke: 34.0
  tri_ka: 34.0
  edge_ke: 0.0024
  edge_kd: 1.75e-05
  soft_contact_mu: 0.3
  self_contact_radius: 0.002
plastic_yield_curvature: 25.0
literature:
  bending_rigidity: 1.6e-05   # B [N m], KES / cantilever
  tri_range: [1100.0, 6100.0]   # tri_ke = tri_ka = 3E/8 from tensile data (10-31), not applied
