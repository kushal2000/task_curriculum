# cotton: the irregular-mesh hinge-rheology cloth (isaacsimenvs/tasks/cloth/utils/hinge_rheology.py), 2026-11-17.
# Bending comes from the measured rigidity B (per-edge B / w_e) and a calibrated bending_stiffness_scale so the 5 cm
# cantilever droops like the swatch (outputs/cloth_probe/v4, v5). Contact as the env: 8 mm particle radius,
# 2 mm self-contact. Swatch target: unpressed fold stays (slight gap, teardrop).
cloth:
  mesh_kind: irregular
  edge_length: 0.010
  density: 0.1156
  tri_ke: 100.0  # Fixed-simulator sweep improved robot folds and press resistance.
  tri_ka: 100.0
  edge_kd: 5.78e-05
  soft_contact_mu: 0.265
  bending_rigidity: 3.358e-05
  bending_stiffness_scale: 1.39
  friction_ratio: 0.3
  friction_slip_curvature: 20.0
  yield_curvature: 30.0   # 0 = no permanent set
  yield_hardening: 0.0
  creep_curvature: 90.0   # held tighter than this, the crease sets with time constant creep_tau
  creep_tau: 0.3
measured:
  cantilever_deg: 30
  bending_rigidity: 3.358e-05
