# Multi-link cartpole rl_games SAPG config.
#
# Hyperparameters mirror PlaySAPG.yaml (play2perfect's SAPG runs) as requested:
# LSTM(units=1024, layers=1, before_mlp, layer_norm) over 4xMLP [1024,1024,512,512],
# lr 1e-4 adaptive with kl_threshold 0.016, e_clip 0.1, mini_epochs 2, critic_coef 4.0,
# mixed_precision, horizon 16, minibatch 98304, expl_coef_block_size 4096.
#
# Two deliberate departures from PlaySAPG:
#
#  1. reward_shaper.scale_value: 1.0 (play uses 0.01). Play's rewards are O(100-1000)
#     -- keypoint_rew_scale 200, lifting_bonus 300, reach_goal_bonus 1000 -- so it scales
#     them down hard. Cartpole rewards are O(1) (alive 1.0, upright 2.0), and 0.01 would
#     shrink the advantage signal to noise. This is task scale, not a tuning preference.
#
#  2. central_value_config input is the cartpole's own critic observation (policy view +
#     raw unmasked joint state + free/locked mask), not play's asymmetric hand state.
#
# Sizing: at num_envs=24576, batch = 16 x 24576 = 393216 and minibatch 98304 gives 4
# minibatches; expl_coef_block_size 4096 gives 6 SAPG blocks. The RNN path also asserts
# (horizon_length * num_actors // num_minibatches) %% seq_length == 0 -> 98304 %% 16 == 0.
#
# Worth knowing: this network is very large for a 26-dim observation and a 1-dim action.
# It is what was asked for and it will train, but if these runs look compute-bound rather
# than sample-bound, the MLP width is the first thing to cut.
#
# Reporting caveat: with mixed_expl the fork sets
# ignore_env_boundary = num_actors - expl_coef_block_size, so every episode metric --
# including episode_final/success and the curriculum/* scalars -- comes from the leader
# block only (the last 4096 envs, exploration coefficient 0).

params:
  seed: 42

  env:
    clip_observations: 10.0   # matches env.obs.clamp_abs_observations
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: coef_cond    # SAPG requires coef_cond (not 'fixed')
    mlp:
      units: [1024, 1024, 512, 512]
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None
    rnn:
      name: lstm
      units: 1024
      layers: 1
      before_mlp: True
      layer_norm: True

  load_checkpoint: False
  load_path: ''

  config:
    # Must start with `<int>_` — our vendored rl_games parses policy_idx from the prefix.
    name: 0_multilink_cartpole_sapg
    full_experiment_name: ${.name}
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: True
    normalize_input: True
    normalize_value: True
    value_bootstrap: True
    normalize_advantage: True
    reward_shaper:
      scale_value: 1.0
    num_actors: ${....env.scene.num_envs}
    gamma: 0.99
    tau: 0.95
    learning_rate: 1e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.016
    score_to_win: 1000000
    max_epochs: 1000000
    save_best_after: 100
    save_frequency: 3000
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: True
    e_clip: 0.1
    minibatch_size: 98304
    mini_epochs: 2
    critic_coef: 4.0
    clip_value: True
    horizon_length: 16
    seq_length: 16
    bounds_loss_coef: 0.0001

    # Asymmetric critic (stateList > obsList)
    central_value_config:
      minibatch_size: 98304
      mini_epochs: 2
      learning_rate: 1e-4
      kl_threshold: 0.016
      clip_value: True
      normalize_input: True
      truncate_grads: True
      network:
        name: actor_critic
        central_value: True
        mlp:
          units: [1024, 1024, 512, 512]
          activation: elu
          d2rl: False
          initializer:
            name: default
          regularizer:
            name: None

    # === SAPG ===
    use_others_experience: lf
    off_policy_ratio: 1.0
    expl_type: mixed_expl_learn_param
    expl_reward_type: entropy
    expl_reward_coef_embd_size: 32
    expl_reward_coef_scale: 0.002
    expl_coef_block_size: 4096

    player:
      deterministic: False
      games_num: 100000
      print_stats: False
