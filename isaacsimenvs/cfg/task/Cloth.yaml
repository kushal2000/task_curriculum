# Cloth — the Play goal-reaching task with a deformable cloth as the manipuland.
#
# GENERATED FROM PlayNewton.yaml (which is itself generated from Play.yaml). The loader does a
# flat `yaml.safe_load` with no inheritance, so this is a full copy; `tests/test_cable_overlay.py`
# asserts it does not drift from PlayNewton on the shared task settings.
#
# Intentional addition: the `cloth:` block. Spawn height lives in `ClothCfg.start_height`.
#
# Note `assets.*` still describes the rigid tool pool. Those URDFs are still generated and baked
# — the cloth replaces the spawned object *after* the scene is built, so the pool is inert here
# rather than absent. Left in place so the two task files stay diffable.

# -----------------------------------------------------------------------------
# DirectRLEnvCfg top-level required fields
# -----------------------------------------------------------------------------
decimation: 2
episode_length_s: 10.0
action_space: 29
# observation_space / state_space are computed in PlayEnv.__init__ from
# obs.obs_list / obs.state_list (see Phase D). Configclass defaults (140/140)
# act only as transient placeholders before __init__ overwrites them.

# -----------------------------------------------------------------------------
# 1) sim — SimulationCfg (60 Hz policy control, 120 Hz physics)
# -----------------------------------------------------------------------------
sim:
  dt: 0.00833333333   # 1/120
  render_interval: 2
  gravity: [0.0, 0.0, -9.81]

# -----------------------------------------------------------------------------
# 2) scene — plain InteractiveSceneCfg (Isaac Lab rejects unknown scene fields,
#    so asset metadata lives under `assets:` below).
# -----------------------------------------------------------------------------
scene:
  num_envs: 768                          # 6 x 128 SAPG blocks; see cfg/train/ClothSAPG.yaml
  env_spacing: 1.2
  # Both must be false for MultiUsdFileCfg to spawn per-env distinct
  # handle_head USDs: replicate_physics=false makes PhysX parse each env
  # as its own subtree; clone_in_fabric=false makes the cloner land env
  # prims in the USD stage (not just Fabric), so the multi-asset
  # spawner's find_matching_prim_paths sees env_1..env_{N-1}.
  replicate_physics: false
  clone_in_fabric: false

# -----------------------------------------------------------------------------
# 3) assets — URDFs, procedural-generation knobs, static per-material frictions
# -----------------------------------------------------------------------------
assets:
  robot_urdf: "assets/urdf/kuka_sharpa_description/iiwa14_left_sharpa_adjusted_restricted.urdf"
  table_urdf: "assets/urdf/table_narrow.urdf"

  object_name: "handle_head_primitives"
  # ONE variant, and only the hammer. The cloth replaces the spawned object, so the tool pool is
  # inert here -- but it is still built, and two things make the inherited pool wrong:
  #   * only hammer variants are baked in the USD cache; anything else dies with a cache miss.
  #   * Newton REQUIRES type-homogeneous collision shapes across worlds (SolverMuJoCo rejects
  #     mixed geom types), which a 6-type pool violates. Eval enforces this with
  #     `use_single_object_variant()`; training passes --single_variant for the same reason.
  handle_head_types: ["hammer"]
  num_assets_per_type: 1

  modify_asset_frictions: true
  robot_friction: 0.5
  finger_tip_friction: 1.5
  object_friction: 0.5
  table_friction: 0.5

# -----------------------------------------------------------------------------
# 3) obs — asymmetric actor-critic obs layout
# -----------------------------------------------------------------------------
obs:
  state_list: [joint_pos, joint_vel, prev_action_targets, palm_pos, palm_rot, palm_vel,
               object_rot, object_vel, fingertip_pos_rel_palm, keypoints_rel_palm,
               keypoints_rel_goal, object_scales, closest_keypoint_max_dist,
               closest_fingertip_dist, lifted_object, progress, successes, reward]
  obs_list: [joint_pos, joint_vel, prev_action_targets, palm_pos, palm_rot,
             object_rot, fingertip_pos_rel_palm, keypoints_rel_palm,
             keypoints_rel_goal, object_scales]
  clamp_abs_observations: 10.0

# -----------------------------------------------------------------------------
# 4) action — moving-average smoothing + speed/force scales
# -----------------------------------------------------------------------------
action:
  arm_moving_average: 0.1
  hand_moving_average: 0.1
  dof_speed_scale: 1.5

# -----------------------------------------------------------------------------
# 5) reward — keypoint + lifting + distance-delta + reach-goal + action penalties
# -----------------------------------------------------------------------------
reward:
  keypoint_rew_scale: 200.0
  keypoint_scale: 1.5
  object_base_size: 0.04
  fixed_size: [0.141, 0.03025, 0.0271]
  fixed_size_keypoint_reward: true

  lifting_rew_scale: 20.0
  lifting_bonus: 300.0
  lifting_bonus_threshold: 0.15

  distance_delta_rew_scale: 50.0
  reach_goal_bonus: 1000.0

  kuka_actions_penalty_scale: 0.03
  hand_actions_penalty_scale: 0.003

# -----------------------------------------------------------------------------
# 6) reset — initial-state distribution + goal sampling
# -----------------------------------------------------------------------------
reset:
  # KEPT ON, unlike the domain_randomization block. This is the initial-state distribution, not
  # sensor/actuator randomisation: zeroing it would make all 768 envs start identically every
  # episode, removing the state diversity RL needs and inviting overfit to one configuration.
  # play2perfect's finetune launchers keep these at exactly these values.
  # For cloth only X and Y reach the sheet -- `ClothAsRigidObject.write_root_pose_to_sim` forces
  # z = spawn_z and drops the orientation draw, so _z and table_reset_z_range are already inert.
  reset_position_noise_x: 0.1
  reset_position_noise_y: 0.1
  reset_position_noise_z: 0.02
  fixed_start_pose: null

  reset_dof_pos_random_interval_arm: 0.1
  reset_dof_pos_random_interval_fingers: 0.1
  reset_dof_vel_random_interval: 0.5

  table_reset_z: 0.38
  table_reset_z_range: 0.01
  table_object_z_offset: 0.25

  goal_sampling_type: delta           # "delta" | "absolute"
  delta_goal_distance: 0.1
  delta_rotation_degrees: 90.0
  target_volume_mins: [-0.35, -0.2, 0.6]
  target_volume_maxs: [0.35, 0.2, 0.95]
  target_volume_region_scale: 1.0

# -----------------------------------------------------------------------------
# 7) termination — end-of-episode conditions + tolerance curriculum
# -----------------------------------------------------------------------------
termination:
  episode_length: 600                 # policy steps (600 * 2 * 1/120 = 10s)
  success_tolerance: 0.04             # == target, so the tolerance curriculum is a no-op
  target_success_tolerance: 0.04      # == start: play2perfect disables the curriculum this way
  eval_success_tolerance: null
  success_steps: 1                    # lump-sum bonus on FIRST entry, as in the finetune launchers
  max_consecutive_successes: 50
  force_consecutive_near_goal_steps: true
  tolerance_curriculum_increment: 0.9
  tolerance_curriculum_interval: 3000

# -----------------------------------------------------------------------------
# 8) domain_randomization — sim2real essentials (delays, noise, impulses)
# -----------------------------------------------------------------------------
domain_randomization:
  # ALL OFF for the finetune. play2perfect keeps DR on during assembly finetuning for sim2real
  # robustness ("we apply domain randomization during assembly finetuning to improve robustness to
  # perception errors, control latency, and contact-dynamics mismatch"); this run deliberately
  # departs from that to get the cleanest possible learning signal first, on a task whose reward
  # events are rare (3 folds / 160 episodes at baseline). Turn it back on for a transfer run.
  #
  # NOTE reset noise is NOT part of this block and is deliberately KEPT -- see `reset:` above.

  # obs / action latency
  use_obs_delay: false
  obs_delay_max: 3
  use_action_delay: false
  action_delay_max: 3

  # object state delay + noise
  use_object_state_delay_noise: false
  object_state_delay_max: 10
  object_state_xyz_noise_std: 0.0
  object_state_rotation_noise_degrees: 0.0
  object_scale_noise_multiplier_range: [1.0, 1.0]

  # per-step obs noise
  joint_velocity_obs_noise_std: 0.0

  # random force/torque impulses. Already inert for cloth regardless --
  # `ClothAsRigidObject.set_external_force_and_torque` is a documented no-op -- but zeroed so the
  # config states the intent rather than relying on the adapter.
  force_scale: 0.0
  force_prob_range: [0.0001, 0.0001]
  force_decay: 0.0
  force_decay_interval: 0.08
  force_only_when_lifted: true

  torque_scale: 0.0
  torque_prob_range: [0.0001, 0.0001]
  torque_decay: 0.0
  torque_decay_interval: 0.08
  torque_only_when_lifted: true

# -----------------------------------------------------------------------------
# newton — MJWarp solver knobs. Every value here is a deliberate departure from a
# library default, and most of the defaults fail *silently*. See NewtonSolverCfg
# for the measurement behind each.
# -----------------------------------------------------------------------------
newton:
  max_triangle_pairs: null      # null => 65536 * num_envs; the 1e6 default is GLOBAL and
                                # silently drops contacts above ~16 envs
  per_env_triangle_pairs: 65536
  njmax: 8192                   # default 300 overflows continuously on this scene
  nconmax: 2048
  cone: elliptic                # default pyramidal; the task authors' MuJoCo scene uses elliptic
  impratio: 10.0                # default 1.0
  condim: 6                     # fidelity, not score: measured neutral post-fix
  use_mujoco_contacts: false    # default true silently ignores per-env meshes
  num_substeps: 2
  deterministic_mode: not_guaranteed

use_gravcomp: true
meshify: false


# -----------------------------------------------------------------------------
# Cloth. Defaults live in ClothCfg; this block only pins what a run should not
# silently inherit. Thickness is the particle *radius* x2 and is bounded by grid
# spacing (size / (resolution - 1)) -- ClothCfg raises if that is violated.
# -----------------------------------------------------------------------------
cloth:
  size: 0.10
  resolution: 9
  thickness: 0.012                       # 12 mm; spacing is 12.5 mm, so just inside the limit
  proxy_mode: staggered                  # the cable result: lagged shakes deformables loose
  substeps: 2
  vbd_iterations: 10                     # Newton's default; 80 cost 5.8x for no quality gain
  # A GENUINE drop. The table's collision surface is at table_reset_z + 0.150, not + 0.045, so the
  # old 0.15 spawned the sheet 0.2 mm above it -- in contact -- and it was ejected upward at
  # ~1.7 m/s every single episode. See ClothCfg.start_height.
  start_height: 0.30
  table_half_thickness: 0.150            # measured from where the sheet rests, not from the USD box
  edge_ke: 0.5                           # 5.0 springs a crease open in 1 step; 0.5 holds
