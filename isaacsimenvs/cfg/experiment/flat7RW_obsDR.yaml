# flat7RW_obsDR (stage 12, run 7): flat7RW_base + observation DR only: point-level object DR (realistic
# lags, flat7FWRHL_dB's values), proprio obs delay (0-3 steps, per episode) and joint pos / vel noise. No
# action delay, no PD-gain / hand / friction DR.
base: flat7RW_base

env:
  domain_randomization:
    point_dr_mode: realistic
    point_base_delay_range: [2, 5]
    point_delay_jitter: 1
    point_delay_max: 10
    point_hold_choices: [1, 2, 3]
    point_noise_std: 0.005
    point_bias_xyz: [0.005, 0.005, 0.005]
    point_common_bias_xyz: [0.015, 0.015, 0.01]
    use_obs_delay: true
    obs_delay_max: 4
    delay_mode: per_episode
    joint_pos_obs_noise_std: 0.005
    joint_velocity_obs_noise_std: 0.1
