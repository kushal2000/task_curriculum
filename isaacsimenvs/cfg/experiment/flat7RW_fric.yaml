# flat7RW_fric (stage 12, run 9): flat7RW_base with the 11-10 contact frictions (plate 1.0, robot 0.5, table
# 1.0, physx_chain.friction_model cloth_min) and their DR (per env at startup). Nothing else changes.
base: flat7RW_base

env:
  assets:
    finger_tip_friction: 0.5
    table_friction: 1.0
  rigid_cloth:
    slat_friction: 1.0
    fingertip_slat_friction: 0.364
    randomization:
      slat_friction_scale: [0.7, 1.5]
      fingertip_friction_scale: [0.7, 1.3]
      table_friction_scale: [0.7, 1.3]
  physx_chain:
    friction_model: cloth_min
