# flat7RW_fricSysid (stage 12, run 14, control for 13): flat7RW_sysid (identified hand + hand-dynamics DR)
# plus flat7RW_fric (11-10 contact frictions, cloth_min, friction DR). No delay / noise DR.
base: flat7RW_sysid

env:
  assets:
    finger_tip_friction: 0.5
    table_friction: 1.0
  rigid_cloth:
    slat_friction: 1.0
    fingertip_slat_friction: 0.364
    randomization:
      slat_friction_scale: [0.7, 1.5]
      fingertip_friction_scale: [0.7, 1.3]
      table_friction_scale: [0.7, 1.3]
  physx_chain:
    friction_model: cloth_min
