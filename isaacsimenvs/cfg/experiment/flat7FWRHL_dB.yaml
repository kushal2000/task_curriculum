# flat7FWRHL_dB: flat7FlexivWujiRHL + observation DR, "realistic" lag model
# (point_dr_mode: realistic). The camera delivers a frame every k steps (k per episode in {1,2,3};
# 30 Hz = 2), each frame's latency = per-episode base + per-frame jitter, delivered in order, the
# newest arrived frame is read (holds, never steps back). Proprio and action delays are fixed per
# episode. Same noise and biases as flat7FWRHL_dA; only the lag model differs.
base: flat7FlexivWujiRHL

env:
  domain_randomization:
    point_dr_mode: realistic
    point_base_delay_range: [2, 5]        # policy steps (1/60 s), inclusive
    point_delay_jitter: 1                 # +-2 bunched in-order frames: k=1 updated on only 50% of steps
    point_delay_max: 10
    point_hold_choices: [1, 2, 3]
    point_noise_std: 0.005
    point_bias_xyz: [0.005, 0.005, 0.005]
    point_common_bias_xyz: [0.015, 0.015, 0.01]
    # *_delay_max is the queue LENGTH: lags 0 .. max-1, so 4 gives the checklist's 0-3 steps.
    use_obs_delay: true
    obs_delay_max: 4
    use_action_delay: true
    action_delay_max: 4
    delay_mode: per_episode
    joint_pos_obs_noise_std: 0.005
    joint_velocity_obs_noise_std: 0.1
    # Per-episode PD gain factors, arm and hand separately (applied to the spec's gains).
    robot_stiffness_scale_range: [0.7, 1.3]
    robot_damping_scale_range: [0.7, 1.3]
    # Hand sysid factors, per episode (PhysX): Coulomb friction per env and joint, torque limit per env.
    hand_friction_scale_range: [0.7, 1.3]
    hand_effort_limit_scale_range: [0.85, 1.15]
  rigid_cloth:
    randomization:
      # Contact friction, drawn per env once at startup (physx_chain.friction_model: cloth_min).
      # Centres: plate 1.0, robot 0.5, table 1.0 (flat7FlexivWujiRHL). Pairs take the lower value:
      # plate-table min(0.7-1.5, 0.7-1.3) = 0.7-1.3, plate-robot = the robot's 0.35-0.65. The plate
      # floor is 0.7 so the table always holds the plate harder than a finger does.
      slat_friction_scale: [0.7, 1.5]
      fingertip_friction_scale: [0.7, 1.3]  # the whole robot under cloth_min
      table_friction_scale: [0.7, 1.3]
