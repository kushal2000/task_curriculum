# vbdRW_allDR (stage 12, run 4): VBD-direct on the right Wuji with the identified hand (FlexivWujiRightReal:
# HAND2_DRIVE kp/kd, sysid armature / friction / passive damping / spring, 1.0 A x Kt torque limit) and every
# DR that exists on Newton: point-level object DR (realistic lags, as flat7FWRHL_dB), proprio / action
# delays and noise, action noise, PD gains, table height +-1.5 cm, the 11-10 contact frictions (centre values).
# Not on Newton: hand friction / torque-limit DR, contact-friction DR, the plates' C layer, felt thickness.
task: Isaacsimenvs-ClothFlexivWujiRightReal-Direct-v0

env:
  reset:
    table_reset_z_range: 0.015
  cloth:
    start_height: 0.20
    soft_contact_mu: 0.265      # fabric_params_release cotton; pairs sqrt(0.265 * 0.5) / sqrt(0.265 * 1.0)
  assets:
    finger_tip_friction: 0.5
    table_friction: 1.0
  domain_randomization:
    point_dr_mode: realistic
    point_base_delay_range: [2, 5]
    point_delay_jitter: 1
    point_delay_max: 10
    point_hold_choices: [1, 2, 3]
    point_noise_std: 0.005
    point_bias_xyz: [0.005, 0.005, 0.005]
    point_common_bias_xyz: [0.015, 0.015, 0.01]
    use_obs_delay: true
    obs_delay_max: 4
    use_action_delay: true
    action_delay_max: 4
    delay_mode: per_episode
    action_noise_std: 0.05
    joint_pos_obs_noise_std: 0.005
    joint_velocity_obs_noise_std: 0.1
    robot_stiffness_scale_range: [0.7, 1.3]
    robot_damping_scale_range: [0.7, 1.3]
