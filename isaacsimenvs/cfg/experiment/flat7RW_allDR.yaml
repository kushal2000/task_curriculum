# flat7RW_allDR (stage 12, run 6): flat7FWRHL_dB (identified hand, 11-10 frictions + friction DR, 5 mm felt,
# table +-1.5 cm, point DR realistic, proprio / action delays, joint noise, PD gains, hand dynamics DR) plus
# flat7DRABC's action noise and C layer (hinge damping / stiffness, plate mass).
base: flat7FWRHL_dB

env:
  domain_randomization:
    action_noise_std: 0.05
  rigid_cloth:
    randomization:
      hinge_damping_scale: [0.5, 3.0]
      hinge_stiffness: [0.0, 5.0e-4]
      mass_scale: [0.7, 1.5]
