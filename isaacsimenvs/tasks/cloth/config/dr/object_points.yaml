# DR block object_points: the camera model on the object points (point_dr_mode: realistic).
#
# Object points (the moving-half corners) and the goal: the camera delivers a frame every k steps
# (k per episode in {1, 2, 3}; 30 Hz = 2), each frame's latency = per-episode base + per-frame jitter,
# delivered in order; the newest arrived frame is read (holds, never steps back). Each point has its
# own noise and per-episode bias; points and goal share a per-episode common bias
# (tasks/cloth/mdp/point_dr.py). Placeholder values from the DR checklist.
domain_randomization:
  point_dr_mode: realistic
  point_base_delay_range: [2, 5]         # policy steps (1/60 s), inclusive
  point_delay_jitter: 1                  # +-2 bunched in-order frames: k=1 updated on only 50% of steps
  point_delay_max: 10
  point_hold_choices: [1, 2, 3]
  point_noise_std: 0.005
  point_bias_xyz: [0.005, 0.005, 0.005]
  point_common_bias_xyz: [0.015, 0.015, 0.01]
