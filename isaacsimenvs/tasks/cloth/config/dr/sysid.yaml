# DR block sysid: the identified right Wuji hand and DR around its identified dynamics.
#
# hand_sysid: the hand's armature, friction, passive damping and spring from the sysid fit, torque limit
# 1.0 A x Kt (robots.with_sysid); PD gains, joint limits and geometry unchanged. Per episode on PhysX:
# Coulomb friction x0.7-1.3 per env and joint, torque limit x0.85-1.15 per env.
hand_sysid: true
domain_randomization:
  hand_friction_scale_range: [0.7, 1.3]
  hand_effort_limit_scale_range: [0.85, 1.15]
