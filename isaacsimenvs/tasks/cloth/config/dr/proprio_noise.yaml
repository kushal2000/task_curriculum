# DR block proprio_noise: proprioception delay and noise.
#
# Observation delay 0-3 steps, fixed per episode (*_delay_max is the queue LENGTH: lags 0 .. max-1);
# joint position noise 0.005 rad, joint velocity noise 0.1 rad/s. Also sets delay_mode for the action delay
# (action_delay).
domain_randomization:
  use_obs_delay: true
  obs_delay_max: 4
  delay_mode: per_episode
  joint_pos_obs_noise_std: 0.005
  joint_velocity_obs_noise_std: 0.1
