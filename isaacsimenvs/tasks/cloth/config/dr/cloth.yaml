# DR block cloth: the sheet's physics on the rigid plates (domain_randomization.cloth; PhysX only).
# Factors and offsets on the configured values, so the centre of each range is the configuration
# (task.yaml, or the recipe's own; flat7FlexivWujiRHL has the real setup's).
#
#   friction       plate x0.7-1.5, robot x0.7-1.3, table x0.7-1.3, drawn once per env at startup.
#                  Needs physx_chain.friction_model: cloth_min. Around the real centres (plate 1.0,
#                  robot 0.5, table 1.0) the plate-table pair stays at or above 0.7, above any finger.
#   hinges, mass   per episode: hinge damping x0.5-3 (log-uniform), hinge stiffness 0-5e-4 N m/rad
#                  (limp to slightly springy), plate mass x0.7-1.5 (flat7DRABC's C layer)
#
# The contact shell's per-episode jitter (contact_margin_offset) is part of the shell's
# configuration and stays where task.yaml or the recipe sets it: +-3 mm in task.yaml, +-1 mm with
# the real setup's 1.5 mm shell (flat7FlexivWujiRHL).
domain_randomization:
  cloth:
    slat_friction_scale: [0.7, 1.5]
    robot_friction_scale: [0.7, 1.3]
    table_friction_scale: [0.7, 1.3]
    hinge_damping_scale: [0.5, 3.0]
    hinge_stiffness: [0.0, 5.0e-4]
    mass_scale: [0.7, 1.5]
