# The VBD evaluation world (experiments/eval.sh `vbd` cell, eval.py --protocol).
# Same for every policy: the policy's training recipe is not applied. Every value is written out,
# so changing task.yaml does not change the evaluation. Fabrics: eval/fabric/<name>.yaml (FABRIC=).
# pinned / rand starts: isaacsimenvs/scripts/evaluation/protocol.py.
#
# History
#   2026-11-23  first version: the old eval cell's values, unchanged
#   2026-11-23  origin/cloth-physics' sheet: 8 mm, full-surface contact, checkerboard mesh, robot 1440 Hz
#   2026-11-24  surface criterion settings written out (goal point-cloud students; others unchanged);
#               layered: each ply matched with its own goal ply
#
# YAML 1.1: write exponent floats as 1.0e-5, or they are read as strings.
task: Isaacsimenvs-Cloth-Direct-v0

env:
  scene:
    num_envs: 32                         # parallel envs

  # ---------------------------------------------------------------------------- robot
  hand_sysid: true                       # identified Wuji hand dynamics
  robot_root_pos: [0.0, 0.51, 0.20]      # robot base position
  robot_self_collision: false            # finger-finger contact (on: far slower)
  robot_self_collision_scope: all        # which links self-collide
  use_gravcomp: true                     # gravity compensation on the arm
  assets:
    robot_urdf: assets/flexiv_wuji/rizon4s_right_wuji_real_limits.urdf   # Flexiv + right Wuji
    table_urdf: assets/urdf/table_narrow.urdf                            # table model

  # ---------------------------------------------------------------------------- time
  sim:
    dt: 0.00833333333                    # 120 Hz
    gravity: [0.0, 0.0, -9.81]
    decimation: 2                        # policy 60 Hz
    robot_substeps: 12                   # robot (MJWarp) 1440 Hz
    cloth_substeps: 1                    # cloth (VBD) 1440 Hz
    vbd_iterations: 12                   # VBD solver iterations per step
  episode_length_s: 10.0                 # episode length

  # ---------------------------------------------------------------------------- the sheet
  cloth:
    # material (SIM1); a fabric file replaces these except tri_kd
    density: 2.0                         # mass per area [kg/m^2]
    tri_ke: 1.0e+2                       # stretch stiffness
    tri_ka: 1.0e+2                       # area stiffness
    tri_kd: 1.5e-6                       # stretch damping
    edge_ke: 8.0e-4                      # bending stiffness
    edge_kd: 1.0e-3                      # bending damping
    plastic_yield_curvature: 0.0         # bending plasticity (0 = elastic, springs back)

    # friction per contact pair
    cloth_cloth_friction: 0.25           # cloth on cloth
    cloth_table_friction: 0.35355339     # cloth on table
    cloth_fingertip_friction: 0.61237244 # cloth on fingertips
    cloth_robot_friction: 0.35355339     # cloth on palm / other phalanges

    # task
    size: 0.10                           # sheet side [m]
    fold_axis: x                         # fold direction
    start_height: 0.20                   # spawn height above table_reset_z
    reset_offset_xy: [0.0, 0.0]          # spawn xy shift
    table_half_thickness: 0.150          # table root to top surface
    keypoint_tolerance: 0.015            # success: keypoints within 1.5 cm
    max_folded_footprint: 0.65           # success: folded extent <= 0.65 size
    nan_policy: reset                    # NaN env: reset, counts as failure

    # mesh
    resolution: 7                        # 7 x 7 particles
    mesh_diagonals: alternate            # triangle cut: checkerboard
    thickness: 0.008                     # particle diameter; also observed (object_scales)

    # cloth-rigid contact
    soft_contact_ke: 5.0e+2              # contact stiffness
    soft_contact_kd: 5.0e-3              # contact damping
    rigid_avbd_beta: 5.0e+5              # AVBD stiffness ramp rate
    rigid_contact_k_start: 1.0e+2        # AVBD ramp start stiffness
    full_surface_contact: true           # edges and faces, not only particles

    # cloth-cloth contact
    enable_self_contact: true            # cloth self-collision
    self_contact_radius: 0.002           # gap between layers
    self_contact_margin: 0.003           # detection distance
    self_contact_detection_interval: -1  # detect every step
    conservative_bound_relaxation: 0.42  # per-iteration move limit

    # robot-cloth coupling
    proxy_mode: staggered                # hand pose used: end of step
    proxy_links: hand                    # coupled links: palm + all phalanges
    proxy_table: true                    # table also coupled
    mass_scale: 1.0                      # proxy mass scale
    collide_interval: 1                  # contact refresh interval
    coupler_iterations: 1                # robot-cloth exchanges per step
    proxy_relaxation: 1.0                # force feedback relaxation (1.0 = off)
    proxy_relaxation_mode: fixed         # relaxation schedule
    proxy_relaxation_min: 0.1            # relaxation lower bound

  # ---------------------------------------------------------------------------- MJWarp
  newton:
    collision_decimation: 0              # robot collision every step
    solver: newton                       # MJWarp constraint solver
    integrator: implicitfast             # time integrator
    iterations: 100                      # solver iterations
    ls_iterations: 15                    # line-search iterations
    ccd_iterations: 35                   # convex collision iterations
    update_data_interval: 2              # data refresh interval
    cone: elliptic                       # friction cone
    impratio: 10.0                       # friction vs normal impedance
    condim: 6                            # contact dims (sliding + torsion + rolling)
    use_mujoco_contacts: false           # Newton collision, not MuJoCo's
    njmax: 32768                         # constraint buffer size

  # ---------------------------------------------------------------------------- start
  # rand uses these; pinned zeroes the noise and centres the sheet
  reset:
    table_reset_z: 0.38                  # table height
    table_reset_z_range: 0.01            # table height noise
    table_object_z_offset: 0.25          # object height above table
    reset_position_noise_x: 0.1          # sheet x noise
    reset_position_noise_y: 0.1          # sheet y noise
    reset_position_noise_z: 0.02         # sheet z noise
    fixed_start_pose: null               # fixed sheet pose (null: off)
    reset_dof_pos_random_interval_arm: 0.1       # arm joint noise
    reset_dof_pos_random_interval_fingers: 0.1   # finger joint noise
    reset_dof_vel_random_interval: 0.5           # joint velocity noise

  termination:
    success_steps: 10                    # fold held 10 policy steps
    success: fold_error                  # 1.5 cm keypoints; eval.py: surface for a goal point-cloud student
    surface:                             # the surface criterion (mdp/surface_match.py)
      ref_step: 12                       # goal sheet frozen here; eval.py sets the student's cloud ref_step
      tolerance_frac: 0.1                # aligned two-sided max < 0.1 x side (1.0 cm on this sheet)
      fine_side: 13                      # particle grid interpolated to 13 x 13
      uniform_start_yaws: 4              # alignment start yaws besides the two major-axis ones
      icp_iters: 3                       # ICP rounds per start yaw
      layered: true                      # each ply vs the goal's same ply (mdp/surface_layered.py)
    max_in_place_dist: .inf              # no in-place gate (in_place_dist only recorded)
    gate_curriculum:                     # off
      max_in_place_dist: []
      slide_penalty_scale: []
