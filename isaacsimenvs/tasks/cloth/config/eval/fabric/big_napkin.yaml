# Big napkin: measured on a 15 x 15 cm swatch, 2026-11-07. The VBD evaluation (../vbd.yaml) with
# this fabric's material and cloth-table friction; everything else -- task, simulation, the other
# three frictions, tri_kd -- is vbd.yaml's. Values: origin/cloth-physics cfg/fabric/big_napkin_measured.yaml.
#
# measured  mass 1.8 g; cantilever 30 deg (tip line below horizontal, 5.25 cm overhang);
#           slides at 20 deg; bending length 0.03094 m, B = 2.324e-05 N m
#           fold test: folded over and let go -> stays folded, no lift, teardrop
# plasticity: origin/cloth-physics' fit, not refit on the checkerboard (vbd.yaml mesh_diagonals: alternate);
#   only cotton / towel / denim were. Its job ran before the checkerboard tests (28503469), so most likely
#   on the uniform-cut grid; 28268743 (big napkin) is the uniform job by name.
base: ../vbd

env:
  cloth:
    density: 0.08                       # kg/m^2 = 1.8 g / 0.0225 m^2
    tri_ke: 100.0                       # stretch: literature, not measured
    tri_ka: 100.0                       # = tri_ke
    edge_ke: 0.003893                   # bending: cantilever fit on the 10 cm 7x7 sheet (168 x B)
    edge_kd: 4.0e-5                     # 1e-3 x density / 2.0 (1e-3 under-converges on light sheets)
    plastic_yield_curvature: 25.0       # [1/m] fold-press-release on the 7x7 grid, job 28268743: let go -> 12 deg, weighted -> flat
    cloth_table_friction: 0.36397023    # tan(20 deg), slide onset
