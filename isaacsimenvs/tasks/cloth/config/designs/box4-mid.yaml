# box4-mid: four strips in a row (4 plates)
#
# Four strips in a row -- three parallel creases (x = -L/2, 0, L/2). Rooted next to the centre
# crease, so the half fold is one hinge and each outer strip folds in on its own (a gate fold
# when both do). After the half fold s4 lies upside down on s1, so it turns -180 on its layer.
#
# Coordinates are in units of L = size / 2 (the sheet frame is [-1, 1]^2, +z up); fold angles in
# degrees, +180 = a full fold up and over onto the parent. Schema: fold_shapes.load_design.
name: box4-mid
label: four strips in a row (4 plates)
size: 0.1
thickness: 0.002
hinge: mid
plates:  # first = root (the stationary piece); CCW polygons
  s2: [[-0.5, -1], [0, -1], [0, 1], [-0.5, 1]]
  s1: [[-1, -1], [-0.5, -1], [-0.5, 1], [-1, 1]]
  s3: [[0, -1], [0.5, -1], [0.5, 1], [0, 1]]
  s4: [[0.5, -1], [1, -1], [1, 1], [0.5, 1]]
hinges:  # child: [parent, line start, line end]
  s1: [s2, [-0.5, -1], [-0.5, 1]]
  s3: [s2, [0, -1], [0, 1]]
  s4: [s3, [0.5, -1], [0.5, 1]]
seams: []
folds:  # name: [stage, ...]; a stage turns its hinges together
  "half: right over left": [{s3: 180}]
  "left strip in": [{s1: 180}]
  "right strip in": [{s4: 180}]
  "gate (both outer strips in)": [{s1: 180, s4: 180}]
  "gate, then half": [{s1: 180, s4: 180}, {s3: 180}]
  "half, then outer strip (both layers)": [{s3: 180}, {s1: 180, s4: -180}]
grasp: {plate: s4, xy: [1, 0], inset: [-1, 0]}  # viewer pinch point: xy * L + inset * 6 mm
