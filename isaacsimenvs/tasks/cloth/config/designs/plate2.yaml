# plate2: half fold (2 plates), 1 mm plates
#
# box2-mid's geometry (+x half over onto -x) for the plate2 training recipe
# (experiments/nov25_better_rigidcloth/plate2/plate2.yaml), which sets the sheet's physics; the design itself only
# differs in the 1 mm plate.
# Coordinates are in units of L = size / 2 (the sheet frame is [-1, 1]^2, +z up); fold angles in
# degrees, +180 = a full fold up and over onto the parent. Schema: fold_shapes.load_design.
name: plate2
label: plate2 half fold (2 plates)
size: 0.1
thickness: 0.001
hinge: mid
plates:  # first = root (the stationary piece); CCW polygons
  left:  [[-1, -1], [0, -1], [0, 1], [-1, 1]]
  right: [[0, -1], [1, -1], [1, 1], [0, 1]]
hinges:  # child: [parent, line start, line end]
  right: [left, [0, -1], [0, 1]]
seams: []
folds:  # name: [stage, ...]; a stage turns its hinges together
  "half: right over left": [{right: 180}]
grasp: {plate: right, xy: [1, 0], inset: [-1, 0]}  # viewer pinch point: xy * L + inset * 6 mm
