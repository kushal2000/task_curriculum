# Silk, from measurements of a 15 x 15 cm swatch (2026-11-07). Literature preset: silk.yaml.
# density = mass / area; edge_ke tuned by fabric_cantilever.py so the env's 5 cm flap matches the elastica
# for the measured bending length; edge_kd = 1e-3 x density / 2.0; soft_contact_mu = mu_table^2 / 0.5
# (Cloth.yaml table_friction 0.5); tri_ke = tri_ka from silk.yaml (stretch not measured).
cloth:
  density: 0.1156
  tri_ke: 34.0
  tri_ka: 34.0
  edge_ke: 0.004038   # cantilever fit (120 x B), job 28243812
  edge_kd: 5.78e-05
  soft_contact_mu: 0.0622
  self_contact_radius: 0.002
plastic_yield_curvature: 32.0   # 7x7 touch fold, job 28369790 (cloth_plasticity_measured_r7_touch_v3_ns): let go -> springs open to 39 deg (3.4 cm), pressed 0.93 N -> stays 6.5 deg (0.61 cm), reopen 175 deg, drape +1.2 deg. Was 150 (springs flat even pressed)
measured:
  mass_g: 2.6   # 15 x 15 cm swatch
  cantilever_deg: 30   # tip-line angle down from horizontal, 5.25 cm overhang
  friction_deg: 10   # sliding angle on a table / board
  fold_test: folded over and let go -> springs back completely flat
  press_test: 213.1 g weight on the folded swatch -> lies flat; unfolds flat with no crease
  bending_length_m: 0.03094
  bending_rigidity: 3.358e-05   # B = rho g c^3 [N m], read by fabric_cantilever.py
