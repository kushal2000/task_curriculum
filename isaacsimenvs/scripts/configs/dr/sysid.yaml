# DR block sysid: the identified right Wuji hand and DR around its identified dynamics.
#
# The robot setup becomes flexiv_wuji_right_real (robots.FLEXIV_WUJI_RIGHT_REAL: sysid armature /
# friction / passive damping / spring, 1.0 A x Kt torque limit; same URDF, joint limits and geometry
# as flexiv_wuji_right_hl_reallimits). Per episode on PhysX: Coulomb friction x0.7-1.3 per env and
# joint, torque limit x0.85-1.15 per env.
robot_setup: flexiv_wuji_right_real
domain_randomization:
  hand_friction_scale_range: [0.7, 1.3]
  hand_effort_limit_scale_range: [0.85, 1.15]
