# DR block friction: the 2026-11-10 contact frictions and their DR (drawn per env once at startup).
#
# Centres: plate 1.0, robot 0.5 (the Wuji fingertip, not the Sharpa-era 1.5), table 1.0. A real
# cloth on the table is hard to slide or turn; with a finger pressing at N >> the plate's weight, the
# plate follows the finger when finger mu > table mu, so the table must hold harder than a finger.
# PhysX pairs under cloth_min: plate-table min(1.0, 1.0) = 1.0, plate-robot min(1.0, 0.5) = 0.5,
# robot-table (0.5 + 1.0) / 2 = 0.75. DR: plate-table 0.7-1.3, plate-robot = the robot's 0.35-0.65;
# the plate floor 0.7 keeps the table above any finger.
assets:
  finger_tip_friction: 0.5
  table_friction: 1.0
rigid_cloth:
  slat_friction: 1.0
  fingertip_slat_friction: 0.364         # Newton chain only (priority rule); unused on PhysX
  randomization:
    slat_friction_scale: [0.7, 1.5]
    fingertip_friction_scale: [0.7, 1.3]  # the whole robot under cloth_min
    table_friction_scale: [0.7, 1.3]
physx_chain:
  friction_model: cloth_min
