# DR block tracker_reacquire: on top of tracker, re-acquisition failure calibrated to the real data.
#
# An uncovered point is fresh again at once, except with p 0-0.1 (per episode) it stays lost for
# 1-3 s. Probe (flat7RW_base ep3000, 512 envs; share of the not-fresh points that are uncovered,
# real 3-6%): delay 0-0.5 s + p 0-0.5: 30% | 0-0.5 s + p 0-0.1: 25% | 0-0.5 s + p 0: 23% |
# 0-0.2 s + p 0-0.1: 17% | 0-0.1 s + p 0-0.05: 11% | no delay + p 0-0.1: 4% (these values). Any
# delay hits every flicker at an occluder's edge and overshoots.
cloth:
  tracker:
    reacquire: true
    reacquire_delay_s: [0.0, 0.0]
    lost_prob_range: [0.0, 0.1]
