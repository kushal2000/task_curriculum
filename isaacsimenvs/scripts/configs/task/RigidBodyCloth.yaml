# Isaacsimenvs-RigidBodyCloth-Direct-v0 -- fold a rigid cloth -- two plates, one hinge (PhysX, Isaac Sim 5.1 /
# Isaac Lab 2.3, .venv/isaacsim): two plates and one hinge at the horizontal fold line, one size
# design per env (tasks/cloth/backends/rigid/backend.py). Robot: Flexiv Rizon 4s + right Wuji Hand 2 with the
# identified hand (tasks/cloth/backends/robot.py, part of the cfg).
#
# Only what differs from the configclass defaults (tasks/cloth/cloth_cfg.py, backends/rigid/config.py),
# which hold the documentation of every key. The task YAML is the pinned base: DR off here, an
# experiment (isaacsimenvs/scripts/configs/runs/rigid_body_cloth.yaml) turns it on.

scene:
  num_envs: 768                          # 6 x 128 SAPG blocks; see isaacsimenvs/scripts/configs/train/ClothSAPG.yaml

domain_randomization:
  use_obs_delay: false
  use_action_delay: false
  use_object_state_delay_noise: false
  object_state_xyz_noise_std: 0.0
  object_state_rotation_noise_degrees: 0.0
  joint_velocity_obs_noise_std: 0.0

task:
  keypoint_tolerance: 0.015              # success: every tracked corner within 1.5 cm of its target
  max_folded_footprint: 0.65             # ... and the extent along the fold axis below 65% of the length
  nan_policy: reset
