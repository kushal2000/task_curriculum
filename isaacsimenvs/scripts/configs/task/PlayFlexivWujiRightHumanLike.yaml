# Isaacsimenvs-PlayFlexivWujiRightHumanLike-Direct-v0 (alias ...RightReal: the identified hand): the
# Play task on the Flexiv Rizon 4s + right Wuji Hand 2 in the real setup's table and goal geometry,
# as the Play priors (kushal/2026-10-30_pretraining_real, run 41213) were trained. PhysX
# (.venv_isaacsim).
#
# Only what differs from the configclass defaults (tasks/play/play_env_cfg.PlayEnvCfg, which documents
# every key and whose robot is this one).

sim:
  dt: 0.00833333333                     # 1/120 to 11 digits (bit-identical to the trained runs)

assets:
  table_urdf: "assets/urdf/table_narrow_flexiv.urdf"   # table_narrow.urdf as a 4 cm slab

reset:
  # The real setup's table, measured from the robot frame (robot root at (0, 0.8, 0)): top 0.28 m
  # above it, near side 0.31 m in front. The 4 cm slab is centred at y = 0.8 - 0.31 - 0.4/2 = 0.29,
  # z = 0.28 - 0.02 = 0.26. Objects still start 0.10 m above the top, and the goal volume keeps
  # Play's place relative to the table top centre, but for y_min, taken out to 0 (0.49 m past the
  # table's near side).
  table_reset_z: 0.26
  table_object_z_offset: 0.12
  table_reset_xy: [0.0, 0.29]
  target_volume_mins: [-0.35, 0.0, 0.35]
  target_volume_maxs: [0.35, 0.49, 0.7]
  use_goal_table_clearance: true        # goal object kept goal_table_clearance_m above the table top
