# flat7RW_trkD (stage 13, run D): flat7RW_trkC (tracker DR, geometric occlusion only) + flat7RW_fric's contact frictions
# and their DR + flat7RW_sysid's identified hand (RightReal) and hand-dynamics DR + PD gains x0.7-1.3 and
# an action delay of 0-3 steps per episode.
base: flat7RW_trkC
task: Isaacsimenvs-FoldPoolPhysxFlexivWujiRightReal-Direct-v0

env:
  assets:
    finger_tip_friction: 0.5
    table_friction: 1.0
  rigid_cloth:
    slat_friction: 1.0
    fingertip_slat_friction: 0.364
    randomization:
      slat_friction_scale: [0.7, 1.5]
      fingertip_friction_scale: [0.7, 1.3]
      table_friction_scale: [0.7, 1.3]
  physx_chain:
    friction_model: cloth_min
  domain_randomization:
    hand_friction_scale_range: [0.7, 1.3]
    hand_effort_limit_scale_range: [0.85, 1.15]
    robot_stiffness_scale_range: [0.7, 1.3]
    robot_damping_scale_range: [0.7, 1.3]
    use_action_delay: true
    action_delay_max: 4
