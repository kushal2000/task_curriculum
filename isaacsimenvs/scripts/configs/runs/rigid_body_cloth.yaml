# Rigid2Deform: fold a rigid cloth (two plates, one hinge), Flexiv Rizon 4s + right Wuji Hand 2 (identified
# hand), SimToolReal's DR, from scratch.
#
# Every env carries one of 4096 rigid-cloth designs (16 lengths x 16 widths, 10-30 cm, x 16 thicknesses,
# 2-20 mm): env i -> design i % 4096, so each of the 6 SAPG blocks of 4096 envs holds every design
# once. The task is fold only (start flat, + half onto -); the uniform start yaw also covers
# "vertical" folds. Material differences are re-drawn per env at EVERY reset: hinge damping and
# stiffness, plate / robot / table friction (rigid_cloth.randomization, tasks/cloth/backends/rigid/config.py).
#
#   experiments/submit.sh --time=7-00:00:00 experiments/train.sh \
#       --task Isaacsimenvs-RigidBodyCloth-Direct-v0 --experiment rigid_body_cloth \
#       agent.params.config.name=0_<run name>
#
# 2 GPUs (`--distributed`, env.scene.num_envs is per GPU): set env.scene.num_envs=12288 and
# agent.params.config.expl_coef_block_size=2048; each block of 2048 then holds half the designs.
#
# Variants are command-line overrides, not more files:
#   no cloth DR:          env.rigid_cloth.randomization.enabled=false
#   no DR at all:         --pinned
task: Isaacsimenvs-RigidBodyCloth-Direct-v0

env:
  scene:
    num_envs: 24576

  # Contact frictions: plates 1.0 (rigid_cloth.friction), robot 0.5, table 0.5 -- the table what the
  # pre-rewrite env actually applied (Play's material pass gave it robot_friction) and what the
  # measured fabric presets were fit against (Cloth.yaml table_friction 0.5).
  assets:
    robot_friction: 0.5
    finger_tip_friction: 0.5
    table_friction: 0.5

  reset:
    table_reset_z_range: 0.015

  domain_randomization:
    # SimToolReal's Play DR (Play.yaml's defaults): observation and action delay, object-state delay
    # and noise, joint-velocity noise.
    use_obs_delay: true
    obs_delay_max: 3                     # lags 0-2 steps
    use_action_delay: true
    action_delay_max: 3
    use_object_state_delay_noise: true
    object_state_delay_max: 10
    object_state_xyz_noise_std: 0.01     # m
    object_state_rotation_noise_degrees: 5.0
    joint_velocity_obs_noise_std: 0.1

agent:
  params:
    config:
      multi_gpu: false
      max_epochs: -1                     # no limit
      minibatch_size: 24576
      central_value_config:
        minibatch_size: 24576
      expl_coef_block_size: 4096         # num_envs / 6 SAPG blocks = one full design set
      best_save_min_interval_s: 60
      periodic_save_every: 100
      snapshot_every: 100
