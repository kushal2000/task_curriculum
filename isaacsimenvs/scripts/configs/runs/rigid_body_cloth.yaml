# Default rigid-cloth transfer recipe: five symmetric approximations, shared sheet
# material properties, effective contact friction, and fold-then-release bonuses.
#
# Default DR recipe for rigid cloth training and the Viser inspector.
# A YAML design is assigned independently of the size grid. Physical material draws
# occur per environment at reset, with one shared draw across each cloth's hinges.
# Density scales all plate masses and inertias together. Armature is numerical
# added inertia, expressed relative to each hinge's physical child-side inertia.
# Sheet bending ranges remain provisional and require calibration experiments.
# Hinge gains are geometry-scaled; effective friction uses multiply combine mode.
#
#   experiments/submit.sh --time=7-00:00:00 experiments/train.sh \
#       --task Isaacsimenvs-RigidBodyCloth-Direct-v0 --experiment rigid_body_cloth \
#       agent.params.config.name=0_<run name>
#
# 2 GPUs (`--distributed`, env.scene.num_envs is per GPU): set env.scene.num_envs=12288 and
# agent.params.config.expl_coef_block_size=2048; each block of 2048 then holds half the designs.
#
# Variants are command-line overrides, not more files:
#   no cloth DR:          env.rigid_cloth.randomization.enabled=false
#   no DR at all:         --pinned
task: Isaacsimenvs-RigidBodyCloth-Direct-v0

env:
  scene:
    num_envs: 24576

  # Active physical DR parameters. Viser reads defaults/bounds from this block.
  rigid_cloth:
    designs: [single_hinge.yaml, strip_4.yaml, strip_8.yaml, hinge_band.yaml, flexible_corners.yaml]
    design_levels: 16
    length_range: [0.10, 0.30]           # m, construction-time size grid
    width_range: [0.10, 0.30]
    thickness_range: [0.002, 0.002]      # fixed 2 mm collision approximation
    density: 0.1                        # nominal kg/m²; 100 g/m²
    bending_rigidity: 0.00005           # B [N m]; k_joint = B × hinge_length / span
    bending_viscosity: 0.00005          # C [N m s]; c_joint = C × hinge_length / span
    hinge_armature: 0.0                 # no artificial rotor inertia by default
    table_static_friction: 0.4          # effective cloth/table contact coefficient
    hand_static_friction: 0.8           # effective cloth/robot contact coefficient
    dynamic_friction_ratio: 0.8         # dynamic/static, for both contact pairs
    place_x: [-0.20, 0.20]              # whole-sheet placement region, table-relative m
    place_y: [-0.17, 0.17]
    randomization:
      enabled: true
      density: [0.02, 0.5]              # kg/m², log-uniform; 20–500 g/m²
      bending_rigidity: [0.000001, 0.00025]   # B [N m], log-uniform; provisional
      bending_viscosity: [0.000001, 0.00015]  # C [N m s], log-uniform; provisional
      hinge_armature_scale: [0.0, 0.0]  # disabled; optional numerical override only
      table_static_friction: [0.1, 0.8] # effective coefficient, uniform buckets
      hand_static_friction: [0.3, 1.2]  # effective coefficient, uniform buckets
      dynamic_friction_ratio: [0.6, 1.0]
      friction_buckets: 16

  # One-time bonuses: fold +1000, then +1000 when the fold is still valid and
  # EVERY robot collider is at least 10 cm clear. No release hold timer.
  task:
    mode: fold
    release:
      enabled: true
      touch: robot_clearance
      clearance: 0.1
      fold_entry_bonus: 1000.0
      release_bonus: 1000.0
      release_dist_rew_scale: 0.0
      persist_rew_per_step: 0.0
      persist_bonus: 0.0

  # Active initial-state DR. XY bounds describe a placement region in the table's
  # frame; valid cloth centers account for the sheet footprint at the sampled yaw.
  reset:
    table_reset_z_range: 0.015           # m, uniform ± range
    reset_dof_pos_random_interval_arm: 0.1
    reset_dof_pos_random_interval_fingers: 0.1
    reset_dof_vel_random_interval: 0.5
    reset_position_noise_x: 0.1          # nonzero enables random rigid placement
    reset_position_noise_y: 0.1
    random_yaw: true
    yaw_range_deg: [0.0, 360.0]          # uniform; shared by training and viewer

  domain_randomization:
    # SimToolReal's Play DR (Play.yaml's defaults): observation and action delay, object-state delay
    # and noise, joint-velocity noise.
    use_obs_delay: true
    obs_delay_max: 3                     # lags 0-2 steps
    use_action_delay: true
    action_delay_max: 3
    use_object_state_delay_noise: true
    object_state_delay_max: 10
    object_state_xyz_noise_std: 0.01     # m
    object_state_rotation_noise_degrees: 5.0
    joint_velocity_obs_noise_std: 0.1

agent:
  params:
    config:
      multi_gpu: false
      max_epochs: -1                     # no limit
      minibatch_size: 24576
      central_value_config:
        minibatch_size: 24576
      expl_coef_block_size: 4096         # num_envs / 6 SAPG blocks = one full design set
      best_save_min_interval_s: 60
      periodic_save_every: 100
      snapshot_every: 100
