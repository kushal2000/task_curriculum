# pcRW_scratch: the point-cloud actor trained by SAPG from a random initialisation on the flat7RW_base
# fold pool (no prior, no teacher). The actor reads the scene cloud + proprioception
# (isaacsimenvs/scripts/distillation/pc_rl.py; pass --pc_args), the central value network the privileged state.
# Env count, minibatch and SAPG block are per rank and come from scripts/cluster/bos14_pc_rl_train.sh.
base: flat7RW_base

agent:
  params:
    config:
      best_save_min_interval_s: 1800   # a "best" checkpoint is ~0.5 GB and 7 s; the evaluations use snap_* / last_*
