[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "task-curriculum"
version = "0.1.0"
description = "Cloth-folding RL on Isaac Lab: rigid-body Play, rigid-plate and VBD cloth fold envs (PhysX and Newton), and the real-robot deploy for the Flexiv Rizon 4s + Wuji Hand 2."
readme = "README.md"
# Upper bound raised from <3.12 for the Newton backend: Isaac Lab 3.0 requires Python 3.12,
# and the same source tree is editable-installed into both venvs (.venv/isaacsim on 3.11,
# .venv/isaaclab3 on 3.12) so that one copy of the task and eval code serves both.
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Kushal Kedia", email = "kk837@cornell.edu" },
]
keywords = ["robotics", "rl", "cloth", "isaac-sim", "manipulation"]
classifiers = [
    "Natural Language :: English",
    "Programming Language :: Python :: 3.11",
]

# NOTE: Isaac Sim / Isaac Lab and torch are installed separately into a Python 3.11
# venv (see docs/installation/README.md). Install this package with `--no-deps`.
dependencies = [
    "gym==0.23.1",
    "omegaconf",
    "hydra-core>=1.2",
    "termcolor",
    "jinja2",
    "numpy",
    "scipy",
    "matplotlib",
    "trimesh",
    "yourdfpy",
    "viser",
    "requests",
    "tqdm",
    "tyro",
    "huggingface_hub",
    "imageio",
    "imageio[ffmpeg]",
    "opencv-python",
    "pillow",
    "transforms3d",
    "wandb",
    "tensorboard",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "ruff",
    "pytest",
]

[tool.setuptools.packages.find]
include = [
    "isaacsimenvs*",
]

[tool.setuptools.package-data]
"isaacsimenvs.scripts.visualization.interactive_viewer" = ["*.html"]
"isaacsimenvs.scripts.configs" = [
    "task/*.yaml", "robot/*.yaml", "deformable_cloth_designs/*.yaml", "train/*.yaml", "runs/*.yaml",
    "rigid_cloth_designs/*.yaml", "rigid_cloth_designs/*.png", "rigid_cloth_designs/README.md",
]

# Every tool cache lives under .cache/ (gitignored), one subfolder per tool.
[tool.pytest.ini_options]
cache_dir = ".cache/pytest"
# Tests live next to the runtime code and YAML configuration they check.
# importlib mode allows tests/ folders without __init__.py and avoids filename clashes.
testpaths = ["isaacsimenvs"]
addopts = "--import-mode=importlib"

[tool.ruff]
cache-dir = ".cache/ruff"
