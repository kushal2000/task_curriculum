[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "task-curriculum"
version = "0.1.0"
description = "Does curriculum learning beat from-scratch RL? Two difficulty-parameterised Isaac Sim environments and the scaffolding to A/B it."
readme = "README.md"
# Upper bound raised from <3.12 for the Newton backend: Isaac Lab 3.0 requires Python 3.12,
# and the same source tree is editable-installed into both venvs (.venv_isaacsim on 3.11,
# .venv_isaaclab3 on 3.12) so that one copy of the task and eval code serves both.
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Kushal Kedia", email = "kk837@cornell.edu" },
]
keywords = ["robotics", "rl", "curriculum", "isaac-sim", "manipulation"]
classifiers = [
    "Natural Language :: English",
    "Programming Language :: Python :: 3.11",
]

# NOTE: Isaac Sim / Isaac Lab and torch are installed separately into a Python 3.11
# venv (see docs/isaacsim_installation.md). Install this package with `--no-deps`.
dependencies = [
    "gym==0.23.1",
    "omegaconf",
    "hydra-core>=1.2",
    "termcolor",
    "jinja2",
    "numpy",
    "scipy",
    "matplotlib",
    "trimesh",
    "yourdfpy",
    "viser",
    "requests",
    "tqdm",
    "tyro",
    "huggingface_hub",
    "imageio",
    "imageio[ffmpeg]",
    "opencv-python",
    "pillow",
    "transforms3d",
    "wandb",
    "tensorboard",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "ruff",
    "pytest",
]

[tool.setuptools.packages.find]
include = [
    "isaacsimenvs*",
]
